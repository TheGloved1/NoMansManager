[package]
name = "nomodssky"
version = "26.9.2"
description = "No Man's Sky Mod Manager — Tauri + SvelteKit"
authors = ["TheGloved1"]
license = "MIT"
edition = "2021"

[lib]
name = "nomodssky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
walkdir = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
zip = "4"

[profile.dev]
incremental = true

[profile.release]
strip = true
lto = true
opt-level = "s"
panic = "abort"
